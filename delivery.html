<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVS Cafe — Delivery Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#161311; --yellow:#FFC72C; --blue:#1E3A8A; --cream:#FFF8E7;
    --line: rgba(22,19,17,0.14); --red:#C0392B;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--cream); color:var(--black); line-height:1.5;}
  h1,h2,h3{font-family:'Archivo Black',sans-serif;}
  .wrap{max-width:820px; margin:0 auto; padding:20px;}

  header{background:var(--black); color:var(--cream); padding:16px 20px; padding-top:calc(16px + env(safe-area-inset-top,0px)); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5;}
  header h1{font-size:1.1rem; color:var(--yellow);}
  #logoutBtn{background:none; border:1px solid var(--cream); color:var(--cream); padding:6px 12px; border-radius:6px; font-size:0.8rem; cursor:pointer;}

  #loginScreen{max-width:360px; margin:80px auto; text-align:center; padding:0 20px;}
  #loginScreen h2{margin-bottom:16px;}
  #loginScreen input{width:100%; padding:12px; border:2px solid var(--line); border-radius:8px; font-size:1rem; margin-bottom:12px;}
  #loginScreen button{width:100%; background:var(--black); color:var(--yellow); border:none; padding:13px; border-radius:8px; font-weight:700; font-size:1rem; cursor:pointer;}
  #loginError{color:var(--red); font-size:0.85rem; margin-top:8px; min-height:1.2em;}

  .section-label{font-size:0.85rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:rgba(22,19,17,0.55); margin:24px 0 10px;}
  .order-card{background:#fff; border:2px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
  .order-card.unclaimed{border-color:var(--red); background:#FFF3F1;}
  .order-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .order-top .name{font-weight:700; font-size:1.05rem;}
  .order-top .time{font-size:0.78rem; color:rgba(22,19,17,0.55); white-space:nowrap;}
  .badge{display:inline-block; font-size:0.72rem; font-weight:700; padding:3px 10px; border-radius:20px; margin-bottom:8px;}
  .badge.processing{background:var(--red); color:#fff;}
  .badge.out{background:var(--yellow); color:var(--black);}
  .badge.delivered{background:#2E7D32; color:#fff;}
  .order-row{font-size:0.9rem; margin-bottom:4px;}
  .order-row a{color:var(--blue); text-decoration:underline;}
  .order-items{font-size:0.88rem; margin:8px 0; padding:8px 10px; background:var(--cream); border-radius:8px;}
  .order-actions{margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;}
  .order-actions button{background:var(--black); color:var(--yellow); border:none; padding:10px 16px; border-radius:8px; font-weight:700; font-size:0.88rem; cursor:pointer;}
  .assigned-to{font-size:0.85rem; color:var(--blue); font-weight:600; margin-top:6px;}
  .empty-msg{text-align:center; color:rgba(22,19,17,0.5); padding:30px 0; font-size:0.9rem;}
  #refreshNote{text-align:center; font-size:0.78rem; color:rgba(22,19,17,0.45); margin-top:20px;}
</style>
</head>
<body>

<div id="loginScreen">
  <h2>Delivery Dashboard</h2>
  <p style="margin-bottom:16px; color:rgba(22,19,17,0.65); font-size:0.9rem;">Enter the staff password to view live orders.</p>
  <input type="password" id="passwordInput" placeholder="Password">
  <button onclick="cvsLogin()">Unlock</button>
  <div id="loginError"></div>
</div>

<div id="dashboard" style="display:none;">
  <header>
    <h1>CVS CAFE · DELIVERY</h1>
    <button id="logoutBtn" onclick="cvsLogout()">Log out</button>
  </header>
  <div class="wrap">
    <div class="section-label">🆕 New orders — not yet taken</div>
    <div id="processingList"></div>

    <div class="section-label">🚴 Out for delivery</div>
    <div id="outList"></div>

    <div class="section-label">✅ Delivered today</div>
    <div id="deliveredList"></div>

    <div id="refreshNote">Refreshes automatically every 10 seconds.</div>
  </div>
</div>

<script>
(function(){
  var token = '';
  var pollTimer = null;

  window.cvsLogin = function(){
    var pw = document.getElementById('passwordInput').value.trim();
    if(!pw){ return; }
    token = pw;
    fetch('/.netlify/functions/orders', { headers: { 'x-dashboard-token': token } })
      .then(function(res){
        if(res.status === 401){ throw new Error('wrong'); }
        return res.json();
      })
      .then(function(data){
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        renderOrders(data.orders || []);
        pollTimer = setInterval(loadOrders, 10000);
      })
      .catch(function(){
        document.getElementById('loginError').textContent = 'Incorrect password.';
      });
  };

  window.cvsLogout = function(){
    token = '';
    if(pollTimer) clearInterval(pollTimer);
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('passwordInput').value = '';
  };

  function loadOrders(){
    fetch('/.netlify/functions/orders', { headers: { 'x-dashboard-token': token } })
      .then(function(res){ return res.json(); })
      .then(function(data){ renderOrders(data.orders || []); })
      .catch(function(){ /* silent — will retry on next poll */ });
  }

  function timeAgo(iso){
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + ' min ago';
    var hrs = Math.round(mins / 60);
    return hrs + ' hr ago';
  }

  function orderCard(o, unclaimed){
    var div = document.createElement('div');
    div.className = 'order-card' + (unclaimed ? ' unclaimed' : '');
    var badgeClass = o.status === 'processing' ? 'processing' : (o.status === 'out_for_delivery' ? 'out' : 'delivered');
    var badgeText = o.status === 'processing' ? (unclaimed ? '⚠ NOT YET TAKEN' : 'PROCESSING') : (o.status === 'out_for_delivery' ? 'OUT FOR DELIVERY' : 'DELIVERED');

    var html = '<div class="badge ' + badgeClass + '">' + badgeText + '</div>' +
      '<div class="order-top"><div class="name">' + escapeHtml(o.name) + '</div><div class="time">' + timeAgo(o.createdAt) + '</div></div>' +
      '<div class="order-row">📞 <a href="tel:' + escapeHtml(o.phone) + '">' + escapeHtml(o.phone) + '</a></div>' +
      '<div class="order-row">📍 ' + escapeHtml(o.address) + '</div>' +
      (o.location_link ? '<div class="order-row"><a href="' + escapeHtml(o.location_link) + '" target="_blank" rel="noopener">Open live location in Maps →</a></div>' : '') +
      '<div class="order-items">' + escapeHtml(o.items) + '<br><strong>Total: ' + escapeHtml(o.total) + '</strong> · ' + escapeHtml(o.payment) + '</div>';

    if(o.assignedTo){
      html += '<div class="assigned-to">Taken by: ' + escapeHtml(o.assignedTo) + '</div>';
    }

    div.innerHTML = html;

    var actions = document.createElement('div');
    actions.className = 'order-actions';

    if(o.status === 'processing'){
      var takeBtn = document.createElement('button');
      takeBtn.textContent = 'Take this order';
      takeBtn.onclick = function(){ takeOrder(o.id); };
      actions.appendChild(takeBtn);
    } else if(o.status === 'out_for_delivery'){
      var doneBtn = document.createElement('button');
      doneBtn.textContent = 'Mark delivered';
      doneBtn.onclick = function(){ updateStatus(o.id, 'delivered', undefined); };
      actions.appendChild(doneBtn);
    }
    if(actions.childNodes.length) div.appendChild(actions);

    return div;
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function takeOrder(id){
    var partnerName = prompt('Your name (so the team knows who has this order):');
    if(!partnerName || !partnerName.trim()) return;
    updateStatus(id, 'out_for_delivery', partnerName.trim());
  }

  function updateStatus(id, status, assignedTo){
    var body = { id: id, status: status };
    if(assignedTo !== undefined) body.assignedTo = assignedTo;
    fetch('/.netlify/functions/orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-dashboard-token': token },
      body: JSON.stringify(body)
    }).then(loadOrders).catch(function(){ alert('Could not update the order — check your connection.'); });
  }

  function renderOrders(orders){
    var processingEl = document.getElementById('processingList');
    var outEl = document.getElementById('outList');
    var deliveredEl = document.getElementById('deliveredList');
    processingEl.innerHTML = '';
    outEl.innerHTML = '';
    deliveredEl.innerHTML = '';

    var processing = orders.filter(function(o){ return o.status === 'processing'; });
    var out = orders.filter(function(o){ return o.status === 'out_for_delivery'; });
    var delivered = orders.filter(function(o){ return o.status === 'delivered'; }).slice(0, 15);

    if(processing.length === 0){
      processingEl.innerHTML = '<div class="empty-msg">No new orders right now.</div>';
    } else {
      processing.forEach(function(o){
        var mins = Math.round((Date.now() - new Date(o.createdAt).getTime()) / 60000);
        processingEl.appendChild(orderCard(o, mins > 5));
      });
    }

    if(out.length === 0){
      outEl.innerHTML = '<div class="empty-msg">Nothing out for delivery.</div>';
    } else {
      out.forEach(function(o){ outEl.appendChild(orderCard(o, false)); });
    }

    if(delivered.length === 0){
      deliveredEl.innerHTML = '<div class="empty-msg">No deliveries completed yet.</div>';
    } else {
      delivered.forEach(function(o){ deliveredEl.appendChild(orderCard(o, false)); });
    }
  }

  document.getElementById('passwordInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') cvsLogin();
  });
})();
</script>

</body>
</html>
